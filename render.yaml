services:
  - type: web
    name: dental
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        # The *.onrender.com host is added automatically from
        # RENDER_EXTERNAL_HOSTNAME; list any custom domains here.
        value: ""
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: dental-db
          property: connectionString
      # All sync:false -- Render asks for these at blueprint creation and they
      # are never stored in this file. Leave GEMINI_API_KEY blank to run on the
      # built-in rule engine instead.
      - key: GEMINI_API_KEY
        sync: false
      # The first administrator, created by build.sh because the free plan has
      # no Shell tab. Leave blank to skip.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: dental-db
    plan: free
    databaseName: dental
    user: dental
