services:
  - type: web
    name: dental
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        # The *.onrender.com host is added automatically from
        # RENDER_EXTERNAL_HOSTNAME; list any custom domains here.
        value: ""
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: dental-db
          property: connectionString
      # Set in the Render dashboard (marked sync:false so it is never committed).
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: dental-db
    plan: free
    databaseName: dental
    user: dental
