{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block main_class %}container py-5{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center">
    <i class="bi bi-check-circle text-success fs-1"></i>
    <h1 class="h4 mt-3">Password updated</h1>
    <p class="text-body-secondary">Your new password is now in use.</p>
    <a href="{% url 'core:dashboard' %}" class="btn btn-primary">Back to dashboard</a>
  </div>
</div>
{% endblock %}
